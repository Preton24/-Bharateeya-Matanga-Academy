<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .gold-line { stroke: #C8A45D; stroke-width: 0.75; fill: none; opacity: 0.22; }
      .gold-subtle { stroke: #C8A45D; stroke-width: 0.5; fill: none; opacity: 0.15; }
      .gold-dot { fill: #C8A45D; opacity: 0.25; }
    </style>
  </defs>

  <!-- Diamond Grid -->
  <line x1="0" y1="60" x2="60" y2="0" class="gold-line" />
  <line x1="60" y1="0" x2="120" y2="60" class="gold-line" />
  <line x1="120" y1="60" x2="60" y2="120" class="gold-line" />
  <line x1="60" y1="120" x2="0" y2="60" class="gold-line" />

  <!-- Inner Diamond -->
  <line x1="15" y1="60" x2="60" y2="15" class="gold-subtle" stroke-dasharray="2,2" />
  <line x1="60" y1="15" x2="105" y2="60" class="gold-subtle" stroke-dasharray="2,2" />
  <line x1="105" y1="60" x2="60" y2="105" class="gold-subtle" stroke-dasharray="2,2" />
  <line x1="60" y1="105" x2="15" y2="60" class="gold-subtle" stroke-dasharray="2,2" />

  <!-- Center Mandala -->
  <circle cx="60" cy="60" r="18" class="gold-line" />
  <circle cx="60" cy="60" r="7" class="gold-line" />
  <circle cx="60" cy="60" r="2.5" class="gold-dot" />

  <!-- 8 Petals Center -->
  <g class="gold-line">
    <ellipse cx="60" cy="48" rx="3.5" ry="7" />
    <ellipse cx="60" cy="72" rx="3.5" ry="7" />
    <ellipse cx="48" cy="60" rx="7" ry="3.5" />
    <ellipse cx="72" cy="60" rx="7" ry="3.5" />
    <ellipse cx="51.5" cy="51.5" rx="4" ry="7" transform="rotate(45 51.5 51.5)" />
    <ellipse cx="68.5" cy="51.5" rx="4" ry="7" transform="rotate(-45 68.5 51.5)" />
    <ellipse cx="51.5" cy="68.5" rx="4" ry="7" transform="rotate(-45 51.5 68.5)" />
    <ellipse cx="68.5" cy="68.5" rx="4" ry="7" transform="rotate(45 68.5 68.5)" />
  </g>

  <!-- Corner Quarter Mandalas (0,0), (120,0), (0,120), (120,120) -->
  <circle cx="0" cy="0" r="18" class="gold-line" />
  <circle cx="120" cy="0" r="18" class="gold-line" />
  <circle cx="0" cy="120" r="18" class="gold-line" />
  <circle cx="120" cy="120" r="18" class="gold-line" />
  
  <circle cx="0" cy="0" r="6" class="gold-line" />
  <circle cx="120" cy="0" r="6" class="gold-line" />
  <circle cx="0" cy="120" r="6" class="gold-line" />
  <circle cx="120" cy="120" r="6" class="gold-line" />

  <!-- Diamonds at intersections -->
  <polygon points="60,2 62,0 60,-2 58,0" class="gold-dot" />
  <polygon points="60,122 62,120 60,118 58,120" class="gold-dot" />
  <polygon points="2,60 0,62 -2,60 0,58" class="gold-dot" />
  <polygon points="122,60 120,62 118,60 120,58" class="gold-dot" />
</svg>