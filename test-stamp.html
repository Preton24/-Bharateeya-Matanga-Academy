<!DOCTYPE html>
<html>
<head>
<style>
.stamp-container {
  background: #5C001C;
  padding: 40px;
  display: flex;
  justify-content: center;
}
.stamp-card {
  width: 280px;
  background: #480016;
  border-radius: 12px;
  padding: 24px;
  border: 1px solid rgba(200, 164, 93, 0.4);
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* Authentic stamp using CSS */
.stamp {
  position: relative;
  background-color: #FAF5E8;
  padding: 12px;
  filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
}
/* Perforated edges using radial-gradient */
.stamp::before {
  content: "";
  position: absolute;
  inset: -6px;
  background: 
    /* Top and Bottom */
    radial-gradient(circle, #480016 4px, transparent 4.5px) 0 -6px / 16px 12px repeat-x,
    radial-gradient(circle, #480016 4px, transparent 4.5px) 0 calc(100% + 6px) / 16px 12px repeat-x,
    /* Left and Right */
    radial-gradient(circle, #480016 4px, transparent 4.5px) -6px 0 / 12px 16px repeat-y,
    radial-gradient(circle, #480016 4px, transparent 4.5px) calc(100% + 6px) 0 / 12px 16px repeat-y;
  pointer-events: none;
}
</style>
</head>
<body>
<div class="stamp-container">
  <div class="stamp-card">
    <div class="stamp">
      <div style="background:#fff; padding:6px;">
        <img src="public/images/dr-ambika-shastry.jpg" style="width:180px; height:220px; object-fit:cover; display:block;">
      </div>
    </div>
  </div>
</div>
</body>
</html>
